[package]
name = "ccproxy"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "ccproxy"
path = "src/lib.rs"

[[bin]]
name = "ccproxy"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }

[package]
name = "ccproxy"
version.workspace = true
edition.workspace = true
publish = false
readme = "../../README.md"
description = "API translation proxy for commandcode.ai"
license = "MIT"
documentation = "https://github.com/CelestNya/commandcode-api-proxy/tree/main/docs"

[package.metadata.docs.rs]
all-features = true

# Debian packaging (release name commandcode-proxy; the crate stays ccproxy).
# Built by the release workflow with `cargo deb`; see docs/LINUX-PORT-PLAN.md §5 T3.1.
[package.metadata.deb]
name = "commandcode-proxy"
maintainer = "CelestNya <celestnya@users.noreply.github.com>"
copyright = "2026 CelestNya"
section = "net"
priority = "optional"
# No runtime system deps beyond glibc (rusqlite is bundled; tray is zbus-only).
depends = "$auto"
# built assets (target/release/*) resolve against the workspace root; static
# assets and maintainer-scripts resolve against the crate dir and reject `..`
# segments, so the release workflow stages everything under pkg/ first.
assets = [
  ["target/release/ccproxy", "usr/bin/commandcode-proxy", "755"],
  ["webui/index.html", "usr/share/commandcode-proxy/webui/", "644"],
  ["webui/css/content.css", "usr/share/commandcode-proxy/webui/css/", "644"],
  ["webui/css/controls.css", "usr/share/commandcode-proxy/webui/css/", "644"],
  ["webui/css/detail.css", "usr/share/commandcode-proxy/webui/css/", "644"],
  ["webui/css/layout.css", "usr/share/commandcode-proxy/webui/css/", "644"],
  ["webui/css/log.css", "usr/share/commandcode-proxy/webui/css/", "644"],
  ["webui/css/settings.css", "usr/share/commandcode-proxy/webui/css/", "644"],
  ["webui/css/overview.css", "usr/share/commandcode-proxy/webui/css/", "644"],
  ["webui/css/responsive.css", "usr/share/commandcode-proxy/webui/css/", "644"],
  ["webui/css/tokens.css", "usr/share/commandcode-proxy/webui/css/", "644"],
  ["webui/js/api.js", "usr/share/commandcode-proxy/webui/js/", "644"],
  ["webui/js/app.js", "usr/share/commandcode-proxy/webui/js/", "644"],
  ["webui/js/attempts.js", "usr/share/commandcode-proxy/webui/js/", "644"],
  ["webui/js/core.js", "usr/share/commandcode-proxy/webui/js/", "644"],
  ["webui/js/logs.js", "usr/share/commandcode-proxy/webui/js/", "644"],
  ["webui/js/router.js", "usr/share/commandcode-proxy/webui/js/", "644"],
  ["webui/js/settings.js", "usr/share/commandcode-proxy/webui/js/", "644"],
  ["webui/js/stats.js", "usr/share/commandcode-proxy/webui/js/", "644"],
  ["pkg/systemd/commandcode-proxy.service", "lib/systemd/system/", "644"],
  ["pkg/env.example", "etc/commandcode-proxy/", "640"],
]
maintainer-scripts = "pkg/scripts/"

[lib]
name = "ccproxy"
path = "src/lib.rs"

[[bin]]
name = "ccproxy"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
# Inline-screenshot quality compression (image_compress.rs): pure-Rust,
# no-unsafe crates only — this crate forbids unsafe_code. base64 for the data
# URLs, png for decode, jpeg-encoder for re-encode, sha2 as the memo key.
base64 = "0.22"
jpeg-encoder = "0.6"
png = "0.17"
sha2 = "0.10"
# Decode only: re-encoding always goes out as JPEG. `default-features` off
# drops `rayon` (thread-pool per image buys nothing for one screenshot and
# pulls five more crates into the build).
jpeg-decoder = { version = "0.3", default-features = false }
# Inflate for the update package reader (archive.rs). Already in the tree as a
# dependency of ureq's gzip support; the general-purpose `zip` crate was
# rejected because it drags in aes/zstd/bzip2 for features this does not use.
flate2 = "1.1"

[target.'cfg(windows)'.dependencies]
# Reading the Windows system proxy for `proxy = "default"`. A safe wrapper over
# the registry API, which matters because this crate forbids `unsafe_code` —
# the tray reads the same key through windows-sys, but that escape hatch is not
# available here.
winreg = "0.52"

[target.'cfg(unix)'.dependencies]
# Graceful shutdown on SIGTERM/SIGINT so the CLI's `stop` (and systemd stop)
# let the server drain and clean up its PID file instead of being killed.
signal-hook = "0.3"


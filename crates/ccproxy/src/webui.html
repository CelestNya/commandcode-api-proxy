<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-proxy WebUI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312161D'/%3E%3Cpath d='M8 10l8 6-8 6z' fill='%234C8DFF'/%3E%3Cpath d='M17 22h7' stroke='%23D7DEE8' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0B0E13; --panel: #12161D; --panel2: #171C25; --border: #1F2630;
    --text: #D7DEE8; --muted: #7A8494; --accent: #4C8DFF;
    --ok: #34C98A; --error: #F25F5C; --aborted: #E0A93C; --interrupted: #5FA8F0;
    --warn: #E0A93C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  header .ver { color: var(--muted); font-size: 12px; }
  nav { display: flex; gap: 6px; margin-left: auto; }
  nav a {
    color: var(--muted); text-decoration: none; font-size: 13px;
    padding: 7px 14px; border-radius: 8px; border: 1px solid transparent;
    display: inline-flex; align-items: center; min-height: 40px;
  }
  nav a.active { color: var(--text); background: var(--panel2); border-color: var(--border); }
  nav a:hover { color: var(--text); }
  #live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
  }
  #live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  #live.on .dot { background: var(--ok); }
  main { max-width: 1180px; margin: 0 auto; padding: 22px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ── stats screen ── */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
  }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 26px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card.ok .value { color: var(--ok); }
  .card.error .value { color: var(--error); }
  .card.interrupted .value { color: var(--interrupted); }
  .card.aborted .value { color: var(--aborted); }
  .card.accent .value { color: var(--accent); }

  .section { margin-top: 18px; }
  .section h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; letter-spacing: .4px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chart { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .chart h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .outcome-strip { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--panel2); }
  .outcome-strip i { display: block; height: 100%; }
  .outcome-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .outcome-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .outcome-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  /* ── attempts screen ── */
  .table-wrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: auto; max-height: calc(100vh - 190px);
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th {
    position: sticky; top: 0; background: var(--panel2); color: var(--muted);
    font-weight: 600; font-size: 11.5px; letter-spacing: .3px; z-index: 1;
  }
  td { border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  tr:hover td { background: var(--panel2); }
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; border: 1px solid transparent;
  }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .badge.error { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); background: color-mix(in srgb, var(--error) 12%, transparent); }
  .badge.aborted { color: var(--aborted); border-color: color-mix(in srgb, var(--aborted) 45%, transparent); background: color-mix(in srgb, var(--aborted) 12%, transparent); }
  .badge.interrupted { color: var(--interrupted); border-color: color-mix(in srgb, var(--interrupted) 45%, transparent); background: color-mix(in srgb, var(--interrupted) 12%, transparent); }
  .muted { color: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
    header { padding: 12px 16px; }
    nav { margin-left: 0; width: 100%; }
    nav a { min-height: 44px; padding: 8px 16px; }
    .card .label, .card .sub, #live { font-size: 13px; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>cc-proxy</h1>
  <span class="ver" id="ver"></span>
  <nav>
    <a href="#/stats" id="tab-stats">统计</a>
    <a href="#/attempts" id="tab-attempts">明细</a>
  </nav>
  <span id="live" class="off"><span class="dot"></span><span id="live-text">连接中</span></span>
</header>

<main>
  <!-- ===== 视图：首屏统计 ===== -->
  <section class="view active" id="view-stats">
    <div class="cards">
      <div class="card accent"><div class="label">总尝试</div><div class="value" id="st-total">—</div><div class="sub" id="st-total-sub">—</div></div>
      <div class="card ok"><div class="label">成功</div><div class="value" id="st-ok">—</div><div class="sub">ok</div></div>
      <div class="card error"><div class="label">失败</div><div class="value" id="st-error">—</div><div class="sub" id="st-error-sub">error</div></div>
      <div class="card interrupted"><div class="label">中断拼接</div><div class="value" id="st-interrupted">—</div><div class="sub">interrupted</div></div>
    </div>
    <div class="cards" style="margin-top:14px">
      <div class="card"><div class="label">今日尝试</div><div class="value" id="st-today-count">—</div><div class="sub" id="st-today-sub">本地日界</div></div>
      <div class="card"><div class="label">今日 tokens</div><div class="value" id="st-today-tokens">—</div><div class="sub">输入 + 缓存 + 输出</div></div>
      <div class="card"><div class="label">累计 tokens</div><div class="value" id="st-total-tokens">—</div><div class="sub" id="st-total-tokens-sub">含 reasoning</div></div>
      <div class="card"><div class="label">平均耗时</div><div class="value" id="st-avg-ms">—</div><div class="sub">按成功尝试</div></div>
    </div>
    <div class="section">
      <h2>状态分布</h2>
      <div class="chart">
        <div class="outcome-strip" id="st-strip"></div>
        <div class="outcome-legend" id="st-legend"></div>
      </div>
    </div>
    <div class="section">
      <h2>近 14 天趋势（本地日期）</h2>
      <div class="charts">
        <div class="chart"><h3>每日尝试数</h3><svg id="trend-attempts" viewBox="0 0 560 170" preserveAspectRatio="xMidYMid meet"></svg></div>
        <div class="chart"><h3>每日 tokens</h3><svg id="trend-tokens" viewBox="0 0 560 170" preserveAspectRatio="xMidYMid meet"></svg></div>
      </div>
    </div>
  </section>

  <!-- ===== 视图：二屏明细 ===== -->
  <section class="view" id="view-attempts">
    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:11%"><col style="width:8%"><col style="width:7%"><col style="width:16%">
          <col style="width:6%"><col style="width:14%"><col style="width:12%"><col style="width:9%">
          <col style="width:9%"><col style="width:8%">
        </colgroup>
        <thead>
          <tr>
            <th>时间</th><th>状态</th><th>协议</th><th>模型</th>
            <th>重试</th><th>tokens 入/缓存/出</th><th>errorTag</th><th>耗时</th>
            <th>首字节</th><th>流式</th>
          </tr>
        </thead>
        <tbody id="attempts-body"></tbody>
      </table>
      <div class="empty" id="attempts-empty" style="display:none">账本中没有记录</div>
    </div>
  </section>
</main>

<script>
'use strict';
var $ = function (s) { return document.querySelector(s); };
var state = { stats: null, attempts: [] };

/* ── 格式化 ── */
function fmtInt(n) { return (n == null ? 0 : n).toLocaleString('en-US'); }
function fmtTokens(n) {
  if (n == null) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return fmtInt(n);
}
function fmtMs(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return ms + ' ms';
  if (ms < 60000) return (ms / 1000).toFixed(2) + ' s';
  return Math.floor(ms / 60000) + ' m ' + Math.round((ms % 60000) / 1000) + ' s';
}
function fmtTime(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}
function fmtDay(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
}
function fmtDateTime(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

/* ── 视图切换（hash 路由）── */
function showView() {
  var hash = location.hash === '#/attempts' ? 'attempts' : 'stats';
  $('#view-stats').classList.toggle('active', hash === 'stats');
  $('#view-attempts').classList.toggle('active', hash === 'attempts');
  $('#tab-stats').classList.toggle('active', hash === 'stats');
  $('#tab-attempts').classList.toggle('active', hash === 'attempts');
}
window.addEventListener('hashchange', showView);

/* ── 渲染：首屏统计 ── */
function renderStats(st) {
  if (!st || st.error) { return; }
  var t = st.totals, today = st.today;
  $('#st-total').textContent = fmtInt(t.attempts);
  $('#st-total-sub').textContent = t.latestTs ? '最近 ' + fmtDateTime(t.latestTs) : '暂无记录';
  $('#st-ok').textContent = fmtInt(t.ok);
  $('#st-error').textContent = fmtInt(t.error);
  $('#st-error-sub').textContent = 'error · aborted ' + fmtInt(t.aborted);
  $('#st-interrupted').textContent = fmtInt(t.interrupted);
  $('#st-today-count').textContent = fmtInt(today.attempts);
  $('#st-today-sub').textContent = '今日 ' + fmtTokens(today.promptTokens + (today.cachedTokens || 0) + today.completionTokens) + ' tokens';
  $('#st-today-tokens').textContent = fmtTokens(today.promptTokens + (today.cachedTokens || 0) + today.completionTokens);
  $('#st-total-tokens').textContent = fmtTokens(t.promptTokens + (t.cachedTokens || 0) + t.completionTokens);
  $('#st-total-tokens-sub').textContent = '入 ' + fmtTokens(t.promptTokens) + ' · 缓存 ' + fmtTokens(t.cachedTokens) + ' · 出 ' + fmtTokens(t.completionTokens);
  $('#st-avg-ms').textContent = fmtMs(Math.round(t.avgDurationMs || 0));

  /* 状态分布条 */
  var total = t.attempts || 0;
  var segs = [
    ['ok', t.ok, 'var(--ok)'],
    ['error', t.error, 'var(--error)'],
    ['aborted', t.aborted, 'var(--aborted)'],
    ['interrupted', t.interrupted, 'var(--interrupted)']
  ];
  var strip = '';
  segs.forEach(function (s) {
    var pct = total ? (s[1] / total) * 100 : 0;
    if (pct > 0) strip += '<i style="width:' + pct.toFixed(2) + '%;background:' + s[2] + '"></i>';
  });
  $('#st-strip').innerHTML = strip || '<i style="width:100%;background:var(--panel2)"></i>';
  var legend = '';
  segs.forEach(function (s) {
    legend += '<span><i style="background:' + s[2] + '"></i>' + s[0] + ' ' + fmtInt(s[1]) + '</span>';
  });
  $('#st-legend').innerHTML = legend;

  renderTrend($('#trend-attempts'), st.trend, 'attempts', '#4C8DFF', '次');
  renderTrend($('#trend-tokens'), st.trend, 'tokens', '#34C98A', '');
}

/* 一个 SVG 柱状图：值域映射到 170 高画布（留轴与标签） */
function renderTrend(svg, days, key, color, unit) {
  var W = 560, H = 170, padL = 34, padB = 22, padT = 8;
  var plotW = W - padL - 8, plotH = H - padT - padB;
  var maxV = 1;
  days.forEach(function (d) { if ((d[key] || 0) > maxV) maxV = d[key]; });
  var n = days.length;
  var gap = n > 1 ? (plotW - 16) / n : plotW;
  var bw = Math.min(26, gap * 0.62);
  var parts = ['<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + W + '" y2="' + (H - padB) + '" stroke="#232733"/>'];
  /* 水平参考线 + y 刻度（0 / mid / max） */
  [0, 0.5, 1].forEach(function (f) {
    var y = H - padB - plotH * f;
    var v = maxV * f;
    parts.push('<line x1="' + padL + '" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="#1A2029" stroke-dasharray="2 4"/>');
    var label = key === 'tokens' ? fmtTokens(Math.round(v)) : fmtInt(Math.round(v));
    parts.push('<text x="' + (padL - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="9.5" fill="#7A8494">' + label + '</text>');
  });
  days.forEach(function (d, i) {
    var v = d[key] || 0;
    var h = plotH * (v / maxV);
    var x = padL + i * gap + (gap - bw) / 2;
    var y = H - padB - h;
    parts.push('<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 0).toFixed(1) + '" rx="2" fill="' + color + '" opacity="0.85"/>');
    if (n <= 14) {
      parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - padB + 12) + '" text-anchor="middle" font-size="9" fill="#7A8494">' + fmtDay(d.date) + '</text>');
    }
  });
  if (!days.length) {
    parts.push('<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" font-size="11" fill="#7A8494">暂无数据</text>');
  }
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = parts.join('');
}

/* ── 渲染：二屏明细 ── */
function renderAttempts(list) {
  var body = $('#attempts-body');
  $('#attempts-empty').style.display = list.length ? 'none' : 'block';
  var rows = '';
  list.forEach(function (r) {
    var toks = fmtTokens(r.promptTokens) + ' / ' + fmtTokens(r.cachedTokens) + ' / ' + fmtTokens(r.completionTokens);
    var tag = r.errorTag || '—';
    rows += '<tr>' +
      '<td title="' + (r.ts || '') + '">' + fmtDateTime(r.ts) + '</td>' +
      '<td><span class="badge ' + r.status + '">' + r.status + '</span></td>' +
      '<td>' + r.wire + '</td>' +
      '<td title="' + (r.model || '') + '">' + (r.model || '—') + '</td>' +
      '<td>' + (r.attempt > 1 ? r.attempt : '—') + '</td>' +
      '<td>' + toks + '</td>' +
      '<td title="' + tag + '">' + tag + '</td>' +
      '<td>' + fmtMs(r.durationMs) + '</td>' +
      '<td>' + fmtMs(r.ttfbMs) + '</td>' +
      '<td>' + (r.stream ? '是' : '否') + '</td>' +
      '</tr>';
  });
  body.innerHTML = rows;
}

/* ── 数据入口 ── */
function render(data) {
  state.stats = data.stats;
  state.attempts = data.attempts;
  renderStats(state.stats);
  renderAttempts(state.attempts);
}

function setLive(on) {
  $('#live').classList.toggle('on', on);
  $('#live-text').textContent = on ? '实时' : '重连中';
}

/* 首帧：先拉一次静态数据（SSE 失效时页面仍有内容） */
fetch('/webui/api/stats').then(function (r) { return r.json(); }).then(function (s) {
  state.stats = s; renderStats(s);
}).catch(function () {});
fetch('/webui/api/attempts').then(function (r) { return r.json(); }).then(function (a) {
  state.attempts = a; renderAttempts(a);
}).catch(function () {});

/* 实时通道：SSE 快照 */
var es = new EventSource('/webui/events');
es.addEventListener('snapshot', function (e) {
  try { render(JSON.parse(e.data)); setLive(true); } catch (err) {}
});
es.onopen = function () { setLive(true); };
es.onerror = function () { setLive(false); };

showView();
</script>
</body>
</html>

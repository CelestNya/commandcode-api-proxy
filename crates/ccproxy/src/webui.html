<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-proxy WebUI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2312161D'/%3E%3Cpath d='M8 10l8 6-8 6z' fill='%238AB4F8'/%3E%3Cpath d='M17 22h7' stroke='%23D3E3FD' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Material 3 dark tonal palette, distilled from the Shirone reference */
  :root {
    --bg: #0F1115; --surface: #161A21; --surface-variant: #1D222B; --surface-high: #232A36;
    --outline: #2A3140; --outline-variant: #232A36;
    --primary: #8AB4F8; --primary-container: #1E3A5F; --on-primary-container: #D3E3FD;
    --text: #E3E7EC; --muted: #8B94A3;
    --ok: #81C995; --error: #F28B82; --aborted: #FDD663; --interrupted: #8AB4F8;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    background: var(--bg); color: var(--text); height: 100%;
    font: 13.5px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell { display: flex; height: 100%; }

  /* ── sidebar ── */
  .sidebar {
    width: 208px; flex: none; background: var(--surface);
    border-right: 1px solid var(--outline-variant);
    display: flex; flex-direction: column; padding: 18px 12px;
  }
  .side-logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
  .side-logo svg { width: 26px; height: 26px; flex: none; }
  .side-nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); text-decoration: none; font-size: 13.5px;
    padding: 10px 14px; border-radius: 999px; min-height: 44px;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }
  .nav-item svg { width: 18px; height: 18px; flex: none; transition: transform .18s ease; }
  .nav-item:hover { color: var(--text); background: var(--surface-variant); transform: translateX(3px); }
  .nav-item:hover svg { transform: scale(1.08); }
  .nav-item.active { color: var(--on-primary-container); background: var(--primary-container); }
  .side-foot { margin-top: auto; color: var(--muted); font-size: 12px; padding: 12px 10px 0; border-top: 1px solid var(--outline-variant); line-height: 1.7; }

  /* ── topbar ── */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 24px; background: var(--surface);
    border-bottom: 1px solid var(--outline-variant);
  }
  .topbar .app-name { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  .topbar .app-name small { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 8px; }
  .topbar .spacer { flex: 1; } /* deliberate whitespace, per the requirement */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
    background: var(--surface-variant); border: 1px solid var(--outline-variant);
    border-radius: 999px; padding: 5px 12px; white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--aborted); }
  .chip.on .dot { background: var(--ok); }
  .chip.on b { color: var(--ok); }

  /* ── content ── */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .content { flex: 1; overflow: auto; padding: 20px 24px 40px; max-width: 1280px; width: 100%; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; animation: viewIn .22s ease; }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .view.active { animation: none; }
    .nav-item { transition: none; }
  }

  .metric-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .mcard {
    background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 16px;
    padding: 14px 16px 12px; box-shadow: var(--shadow);
  }
  .mcard .mlabel { color: var(--muted); font-size: 12px; }
  .mcard .mvalue { font-size: 23px; font-weight: 650; margin-top: 5px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .mcard .msub { color: var(--muted); font-size: 12px; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .mcard .msub em { font-style: normal; color: var(--text); }
  .mcard.accent .mvalue { color: var(--primary); }
  .mcard.ok .mvalue { color: var(--ok); }
  .mcard.err .mvalue { color: var(--error); }
  .mcard.warn .mvalue { color: var(--aborted); }

  .ov-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .panel {
    background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 16px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .4px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .panel h2 .extra { margin-left: auto; color: var(--muted); font-weight: 400; }
  .panel h2 .extra a {
    color: var(--muted); text-decoration: none; cursor: pointer; margin-left: 4px;
    border-radius: 999px; padding: 4px 10px; font-size: 12px;
    border: 1px solid var(--outline-variant);
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .panel h2 .extra a:hover { color: var(--text); background: var(--surface-variant); border-color: var(--outline); }
  .panel h2 .extra a.active {
    color: var(--on-primary-container); background: var(--primary-container);
    border-color: transparent; font-weight: 600;
  }


  .model-layout { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: center; }
  .model-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  .model-table th { color: var(--muted); font-weight: 500; text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--outline-variant); font-size: 12px; }
  .model-table th:first-child { text-align: left; }
  .model-table td { padding: 6px 6px; text-align: right; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--outline-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .model-table th:nth-child(1), .model-table td:nth-child(1) { width: 46%; }
  .model-table th:nth-child(2), .model-table td:nth-child(2) { width: 24%; }
  .model-table th:nth-child(3), .model-table td:nth-child(3) { width: 30%; }
  .model-table td:first-child { text-align: left; }
  .model-table tr:last-child td { border-bottom: none; }

  .trend-chart svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }

  .status-bar-row { margin-bottom: 10px; }
  .status-bar-row .sbr-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .status-bar-row .sbr-head b { font-weight: 600; }
  .status-bar-row .sbr-head span { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sbr-track { height: 8px; background: var(--surface-variant); border-radius: 999px; overflow: hidden; }
  .sbr-fill { height: 100%; border-radius: 999px; }

  /* ── detail screen ── */
  .mini-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .mini-card {
    background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 14px;
    padding: 10px 14px; box-shadow: var(--shadow);
  }
  .mini-card .mc-label { color: var(--muted); font-size: 12px; }
  .mini-card .mc-value { font-size: 18px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .mini-card .mc-sub { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

  .filterbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .filterbar select, .filterbar button {
    background: var(--surface-variant); color: var(--text); border: 1px solid var(--outline-variant);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-family: inherit;
    min-height: 34px;
  }
  .filterbar select:focus { outline: 1px solid var(--primary); }
  .filterbar button { cursor: pointer; color: var(--muted); }
  .filterbar button:hover { color: var(--text); border-color: var(--primary); }
  .filterbar .fgrow { flex: 1; }
  .filterbar label { color: var(--muted); font-size: 12px; }
  * { scrollbar-width: thin; scrollbar-color: var(--outline) transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  .table-wrap {
    background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .pager {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 10px 14px; border-top: 1px solid var(--outline-variant);
    font-size: 12.5px; color: var(--muted);
  }
  .pager .pg-btn, .pager select {
    background: var(--surface-variant); color: var(--text);
    border: 1px solid var(--outline-variant); border-radius: 8px;
    padding: 6px 12px; font-size: 12.5px; font-family: inherit; min-height: 34px;
    cursor: pointer;
  }
  .pager .pg-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--text); }
  .pager .pg-btn:disabled { opacity: .45; cursor: default; }
  .pager .pg-btn.active { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }
  .pager .pg-ellipsis { padding: 0 4px; color: var(--muted); }
  .pager .pg-count { margin-right: auto; }
  .pager .pg-size { display: inline-flex; align-items: center; gap: 6px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
  th, td { padding: 9px 10px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th {
    position: sticky; top: 0; background: var(--surface-variant); color: var(--muted);
    font-weight: 500; font-size: 11.5px; letter-spacing: .2px; z-index: 1;
  }
  td { border-top: 1px solid var(--outline-variant); font-variant-numeric: tabular-nums; }
  tr:hover td { background: var(--surface-variant); }
  .tokens-cell b { font-weight: 600; }
  .tokens-cell .up { color: var(--ok); }
  .tokens-cell .down { color: var(--primary); }
  .tokens-cell small { display: block; color: var(--muted); font-size: 11.5px; }
  .lat-cell { line-height: 1.45; }
  .lat-cell small { color: var(--muted); display: block; font-size: 11.5px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid transparent; }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .badge.error { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); background: color-mix(in srgb, var(--error) 12%, transparent); }
  .badge.aborted { color: var(--aborted); border-color: color-mix(in srgb, var(--aborted) 45%, transparent); background: color-mix(in srgb, var(--aborted) 12%, transparent); }
  .badge.interrupted { color: var(--interrupted); border-color: color-mix(in srgb, var(--interrupted) 45%, transparent); background: color-mix(in srgb, var(--interrupted) 12%, transparent); }
  .muted { color: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }

  @media (max-width: 1000px) {
    .metric-cards { grid-template-columns: repeat(2, 1fr); }
    .mini-cards { grid-template-columns: repeat(2, 1fr); }
    .ov-row { grid-template-columns: 1fr; }
    .model-layout { grid-template-columns: 1fr; }
    .sidebar { width: 64px; padding: 14px 8px; }
    .nav-item { justify-content: center; padding: 10px 0; }
    .nav-item span { display: none; }
    .side-logo { justify-content: center; }
    .side-foot { display: none; }
  }
  @media (max-width: 640px) {
    .metric-cards { grid-template-columns: repeat(2, 1fr); }
    .topbar { padding: 10px 14px; flex-wrap: wrap; }
    .content { padding: 14px; }
    .filterbar label { width: 100%; }
    .filterbar select, .filterbar button { min-height: 44px; }
    .pager .pg-btn, .pager select { min-height: 44px; min-width: 44px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="side-logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1E3A5F"/><path d="M8 10l8 6-8 6z" fill="#8AB4F8"/><path d="M17 22h7" stroke="#D3E3FD" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <nav class="side-nav">
      <a href="#/stats" class="nav-item active" id="nav-stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        <span>概览</span>
      </a>
      <a href="#/attempts" class="nav-item" id="nav-attempts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>
        <span>明细</span>
      </a>
    </nav>
    <div class="side-foot">本机代理服务<br>端口 8787 · 数据本机存储</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="app-name">cc-proxy<small id="ver"></small></div>
      <div class="spacer"></div>
      <span class="chip" id="chip-live"><span class="dot"></span><b id="chip-live-text">连接中</b></span>
      <span class="chip">消耗 <b id="chip-tokens">—</b></span>
      <span class="chip">内存 <b id="chip-mem">—</b></span>
      <span class="chip">运行 <b id="chip-uptime">—</b></span>
    </header>

    <main class="content">
      <!-- ===== 视图：概览 ===== -->
      <section class="view active" id="view-stats">
        <div class="metric-cards" id="metric-cards"></div>


        <div class="panel" style="margin-top:12px">
          <h2>
            Token 使用趋势
            <span class="extra">
              <span style="color:var(--muted)">时间范围</span>
              <a id="days-7" data-days="7">近7天</a>
              <a id="days-14" class="active" data-days="14">近14天</a>
              <a id="days-30" data-days="30">近30天</a>
            </span>
          </h2>
          <div class="trend-chart">
            <div class="legend" id="trend-legend"></div>
            <svg id="trend-chart" viewBox="0 0 900 300" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
        </div>

        <div class="ov-row">
          <div class="panel">
            <h2>模型分布 <span class="extra" id="model-count"></span></h2>
            <div class="model-layout">
              <svg id="model-donut" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"></svg>
              <div>
                <table class="model-table">
                  <thead><tr><th>模型</th><th>请求</th><th>Token</th></tr></thead>
                  <tbody id="model-table"></tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="panel">
            <h2>状态分布 <span class="extra" id="status-summary"></span></h2>
            <div id="status-bars"></div>
          </div>
        </div>
      </section>

      <!-- ===== 视图：明细 ===== -->
      <section class="view" id="view-attempts">
        <div class="mini-cards" id="mini-cards"></div>
        <div class="filterbar">
          <label>模型</label>
          <select id="f-model"><option value="">全部</option></select>
          <label>类型</label>
          <select id="f-stream">
            <option value="">全部</option>
            <option value="1">流式</option>
            <option value="0">非流式</option>
          </select>
          <label>状态</label>
          <select id="f-status">
            <option value="">全部</option>
            <option value="ok">ok</option>
            <option value="error">error</option>
            <option value="aborted">aborted</option>
            <option value="interrupted">interrupted</option>
          </select>
          <span class="fgrow"></span>
          <button id="btn-refresh">刷新</button>
          <button id="btn-reset">重置</button>
        </div>
        <div class="table-wrap">
          <table>
            <colgroup>
              <col style="width:4%"><col style="width:14%"><col style="width:15%">
              <col style="width:7%"><col style="width:6%"><col style="width:8%">
              <col style="width:15%"><col style="width:13%"><col style="width:14%"><col style="width:4%">
            </colgroup>
            <thead>
              <tr>
                <th>#</th><th>请求 ID</th><th>模型</th>
                <th>端点</th><th>类型</th><th>状态</th>
                <th>TOKEN</th><th>延迟</th><th>时间</th><th>尝试</th>
              </tr>
            </thead>
            <tbody id="attempts-body"></tbody>
          </table>
          <div class="empty" id="attempts-empty" style="display:none">没有符合条件的记录</div>
          <div class="pager" id="pager"></div>
        </div>
      </section>
    </main>
  </div>
</div><script>
"use strict";
var state = { stats: null, attempts: [], days: 14, page: 1, pageSize: 50, daysFetchAt: 0, filters: { model: "", stream: "", status: "" } };
var PALETTE = ["#8AB4F8", "#81C995", "#FDD663", "#F28B82", "#C58AF9", "#7FD1FF", "#F2B8B5", "#A8DAB5", "#FFD8A8", "#B3C7F9"];

function el(id) { return document.getElementById(id); }
function fmtNum(n) { return (n == null) ? "—" : Number(n).toLocaleString("en-US"); }
function fmtTokens(n) {
  if (n == null) return "—";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}
function fmtPct(v) { return (v == null) ? "—" : (v * 100).toFixed(1) + "%"; }
function fmtDur(ms) { return (ms == null) ? "—" : (ms / 1000).toFixed(2) + "s"; }
function fmtTime(ts) {
  if (!ts) return "—";
  var d = new Date(ts);
  function p(x) { return (x < 10 ? "0" : "") + x; }
  return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function fmtUptime(s) {
  if (s == null) return "—";
  var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  function p(x) { return (x < 10 ? "0" : "") + x; }
  return (d > 0 ? d + "d " : "") + p(h) + ":" + p(m);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ── routing (sidebar) ── */
function route() {
  var h = location.hash || "#/stats";
  var isStats = h.indexOf("attempts") < 0;
  el("view-stats").classList.toggle("active", isStats);
  el("view-attempts").classList.toggle("active", !isStats);
  el("nav-stats").classList.toggle("active", isStats);
  el("nav-attempts").classList.toggle("active", !isStats);
}
window.addEventListener("hashchange", route);

/* ── overview ── */
function renderStats(s) {
  state.stats = s;
  var t = s.totals || {}, td = s.today || {};
  var tTok = (t.promptTokens || 0) + (t.cachedTokens || 0) + (t.completionTokens || 0) + (t.reasoningTokens || 0);
  var tTokIn = (t.promptTokens || 0) + (t.cachedTokens || 0);
  var dTok = (td.promptTokens || 0) + (td.cachedTokens || 0) + (td.completionTokens || 0) + (td.reasoningTokens || 0);
  var fail = (t.error || 0) + (t.aborted || 0) + (t.interrupted || 0);
  var succRate = t.attempts > 0 ? (t.ok / t.attempts) : null;

  var cards = [
    { label: "今日请求", value: fmtNum(td.attempts), sub: "总计: " + fmtNum(t.attempts), cls: "" },
    { label: "今日 Token", value: fmtTokens(dTok), sub: "输入:" + fmtTokens(td.promptTokens) + " / 输出:" + fmtTokens(td.completionTokens) + " / 缓存:" + fmtTokens(td.cachedTokens), cls: "" },
    { label: "累计 Token", value: fmtTokens(tTok), sub: "输入:" + fmtTokens(tTokIn) + " / 输出:" + fmtTokens(t.completionTokens) + " / 缓存:" + fmtTokens(t.cachedTokens), cls: "accent" },
    { label: "成功率", value: fmtPct(succRate), sub: "失败 " + fmtNum(fail) + " 次", cls: (succRate == null || succRate >= 0.95) ? "ok" : "warn" },
    { label: "平均响应", value: fmtDur(t.avgDurationMs), sub: "总耗时", cls: "" },
    { label: "平均首字", value: fmtDur(t.avgTtfbMs), sub: "首字节延迟", cls: "" },
    { label: "缓存命中率", value: fmtPct(t.hitRate), sub: "缓存 / 输入+缓存", cls: "" },
    { label: "总尝试", value: fmtNum(t.attempts), sub: "成功 " + fmtNum(t.ok) + " / 失败 " + fmtNum(fail), cls: "accent" }
  ];
  el("metric-cards").innerHTML = cards.map(function (c) {
    return '<div class="mcard ' + c.cls + '"><div class="mlabel">' + c.label + '</div>' +
           '<div class="mvalue">' + c.value + '</div><div class="msub">' + c.sub + '</div></div>';
  }).join("");


  renderTrend(s.trend || []);
  renderModels(s.models || []);
  var sts = [
    { k: "ok", v: t.ok || 0, c: "var(--ok)" },
    { k: "error", v: t.error || 0, c: "var(--error)" },
    { k: "aborted", v: t.aborted || 0, c: "var(--aborted)" },
    { k: "interrupted", v: t.interrupted || 0, c: "var(--interrupted)" }
  ];
  sts.sort(function (a, b) { return b.v - a.v; }); /* biggest first */
  var tot = t.attempts || 0;
  el("status-summary").textContent = fmtNum(tot) + " 次尝试";
  el("status-bars").innerHTML = sts.map(function (st) {
    var pct = tot > 0 ? (st.v / tot * 100) : 0;
    return '<div class="status-bar-row"><div class="sbr-head"><b>' + st.k + '</b>' +
      '<span>' + fmtNum(st.v) + ' · ' + pct.toFixed(1) + '%</span></div>' +
      '<div class="sbr-track"><div class="sbr-fill" style="width:' + pct.toFixed(1) + '%;background:' + st.c + '"></div></div></div>';
  }).join("");

  /* top-bar consumption chip */
  el("chip-tokens").textContent = fmtTokens(tTok) + " tok";
  renderMiniCards(s);
}

function renderTrend(trend) {
  var LEG = [
    { key: "prompt", name: "Input", color: "#8AB4F8" },
    { key: "completion", name: "Output", color: "#81C995" },
    { key: "cached", name: "Cache Read", color: "#FDD663" },
    { key: "hitRate", name: "Cache Hit Rate", color: "#C58AF9" }
  ];
  el("trend-legend").innerHTML = LEG.map(function (l) {
    return '<span><i style="background:' + l.color + '"></i>' + l.name + '</span>';
  }).join("");
  var svg = el("trend-chart");
  var W = 900, H = 300, ML = 78, MR = 62, MT = 14, MB = 34;
  var pw = W - ML - MR, ph = H - MT - MB;
  if (!trend.length) {
    svg.innerHTML = '<text x="450" y="150" fill="var(--muted)" font-size="13" text-anchor="middle">暂无数据</text>';
    return;
  }
  var maxTok = 0;
  trend.forEach(function (d) {
    maxTok = Math.max(maxTok, (d.prompt || 0), (d.completion || 0), (d.cached || 0));
  });
  if (maxTok <= 0) maxTok = 1;
  function x(i) { return ML + (trend.length === 1 ? pw / 2 : pw * i / (trend.length - 1)); }
  function yTok(v) { return MT + ph - (v / maxTok) * ph; }
  function yPct(v) { return MT + ph - (v == null ? 0 : v) * ph; }
  var out = "";
  for (var g = 0; g <= 4; g++) {
    var gy = MT + ph * g / 4;
    var val = maxTok * (1 - g / 4);
    out += '<line x1="' + ML + '" y1="' + gy + '" x2="' + (W - MR) + '" y2="' + gy + '" stroke="var(--outline-variant)" stroke-width="1"/>';
    out += '<text x="' + (ML - 8) + '" y="' + (gy + 4) + '" fill="var(--muted)" font-size="10" text-anchor="end">' + fmtTokens(Math.round(val)) + '</text>';
  }
  for (var p = 0; p <= 5; p++) {
    var py = MT + ph * p / 5;
    out += '<text x="' + (W - MR + 8) + '" y="' + (py + 4) + '" fill="var(--muted)" font-size="10">' + Math.round(100 - p * 20) + '%</text>';
  }
  var step = Math.max(1, Math.ceil(trend.length / 8));
  trend.forEach(function (d, i) {
    if (i % step !== 0 && i !== trend.length - 1) return;
    out += '<text x="' + x(i) + '" y="' + (H - 14) + '" fill="var(--muted)" font-size="10" text-anchor="middle">' + d.date.slice(5) + '</text>';
  });
  function pts(key, yfn) {
    var arr = [];
    trend.forEach(function (d, i) {
      var v = d[key];
      if (v == null) return;
      arr.push([x(i), yfn(v)]);
    });
    return arr;
  }
  /* Shape-preserving cubic (Fritsch-Carlson PCHIP): smooth but never
     overshoots — the curve stays inside the data's min/max envelope. */
  function pchipSlopes(xs, ys) {
    var n = xs.length, m = new Array(n);
    if (n === 1) { m[0] = 0; return m; }
    var d = new Array(n - 1);
    for (var i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
    m[0] = d[0];
    m[n - 1] = d[n - 2];
    for (var i = 1; i < n - 1; i++) {
      if (d[i - 1] * d[i] <= 0) { m[i] = 0; continue; }
      var h0 = xs[i] - xs[i - 1], h1 = xs[i + 1] - xs[i];
      /* Fritsch-Carlson weighted harmonic mean of adjacent secants */
      var w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
      m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
    }
    return m;
  }
  function pchipPath(ps) {
    var n = ps.length;
    if (!n) return "";
    if (n === 1) return "M" + ps[0][0].toFixed(1) + " " + ps[0][1].toFixed(1);
    if (n === 2) return "M" + ps[0][0].toFixed(1) + " " + ps[0][1].toFixed(1) + " L" + ps[1][0].toFixed(1) + " " + ps[1][1].toFixed(1);
    var xs = [], ys = [];
    ps.forEach(function (pt) { xs.push(pt[0]); ys.push(pt[1]); });
    var m = pchipSlopes(xs, ys);
    var d = "M" + xs[0].toFixed(1) + " " + ys[0].toFixed(1);
    for (var i = 0; i < n - 1; i++) {
      var h = xs[i + 1] - xs[i];
      var c1x = xs[i] + h / 3, c1y = ys[i] + m[i] * h / 3;
      var c2x = xs[i + 1] - h / 3, c2y = ys[i + 1] - m[i + 1] * h / 3;
      d += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + "," + c2x.toFixed(1) + " " + c2y.toFixed(1) + "," + xs[i + 1].toFixed(1) + " " + ys[i + 1].toFixed(1);
    }
    return d;
  }
  var sIn = pts("prompt", yTok), sOut = pts("completion", yTok), sCa = pts("cached", yTok);
  var sHr = pts("hitRate", yPct);
  out += '<path d="' + pchipPath(sIn) + '" fill="none" stroke="#8AB4F8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
         '<path d="' + pchipPath(sOut) + '" fill="none" stroke="#81C995" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
         '<path d="' + pchipPath(sCa) + '" fill="none" stroke="#FDD663" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
         '<path d="' + pchipPath(sHr) + '" fill="none" stroke="#C58AF9" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>';
  /* data points, denser for short windows (7d) and sampled for long ones */
  var dotStep = Math.max(1, Math.ceil(trend.length / 14));
  [[sIn, "#8AB4F8"], [sOut, "#81C995"], [sCa, "#FDD663"], [sHr, "#C58AF9"]].forEach(function (se) {
    var r = se[1] === "#C58AF9" ? 2 : 2.6;
    se[0].forEach(function (pt, idx) {
      if (idx % dotStep !== 0 && idx !== se[0].length - 1) return;
      out += '<circle cx="' + pt[0].toFixed(1) + '" cy="' + pt[1].toFixed(1) + '" r="' + r + '" fill="' + se[1] + '" stroke="var(--bg)" stroke-width="1"/>';
    });
  });
  svg.innerHTML = out;
}

function renderModels(models) {
  el("model-count").textContent = models.length + " 个模型";
  var tot = 0;
  models.forEach(function (m) { tot += m.tokens || 0; });
  el("model-table").innerHTML = models.map(function (m, i) {
    return '<tr><td title="' + esc(m.model) + '">' + esc(m.model) + '</td>' +
      '<td>' + fmtNum(m.attempts) + '</td><td>' + fmtTokens(m.tokens) + '</td></tr>';
  }).join("") || '<tr><td colspan="3" class="muted">暂无数据</td></tr>';
  var svg = el("model-donut");
  var C = 2 * Math.PI * 62;
  if (!tot) {
    svg.innerHTML = '<text x="100" y="104" fill="var(--muted)" font-size="13" text-anchor="middle">暂无数据</text>';
    return;
  }
  var out = '<circle cx="100" cy="100" r="62" fill="none" stroke="var(--surface-variant)" stroke-width="26"/>';
  var acc = 0;
  models.forEach(function (m, i) {
    var frac = (m.tokens || 0) / tot;
    var dash = frac * C - 2;
    if (dash < 0.5) dash = 0;
    out += '<circle cx="100" cy="100" r="62" fill="none" stroke="' + PALETTE[i % PALETTE.length] + '" stroke-width="26" ' +
      'stroke-dasharray="' + dash.toFixed(2) + ' ' + (C - dash).toFixed(2) + '" stroke-dashoffset="' + (-acc * C).toFixed(2) + '" ' +
      'transform="rotate(-90 100 100)"/>';
    acc += frac;
  });
  out += '<text x="100" y="97" fill="var(--text)" font-size="20" font-weight="650" text-anchor="middle">' + fmtTokens(tot) + '</text>' +
    '<text x="100" y="116" fill="var(--muted)" font-size="11" text-anchor="middle">累计 Token</text>';
  svg.innerHTML = out;
}

/* ── mini stat row above the details table ── */
function renderMiniCards(s) {
  if (!s) return;
  var t = s.totals || {}, td = s.today || {};
  var succRate = t.attempts > 0 ? (t.ok / t.attempts * 100) : null;
  var cards = [
    { label: "今日请求", value: fmtNum(td.attempts), sub: "累计 " + fmtNum(t.attempts) },
    { label: "成功率", value: fmtPct(succRate / 100), sub: "ok " + fmtNum(t.ok) },
    { label: "平均耗时", value: fmtDur(t.avgDurationMs), sub: "首字 " + fmtDur(t.avgTtfbMs) },
    { label: "缓存命中", value: fmtPct(t.hitRate), sub: fmtTokens((t.promptTokens || 0) + (t.cachedTokens || 0)) + " 输入" }
  ];
  el("mini-cards").innerHTML = cards.map(function (c) {
    return '<div class="mini-card"><div class="mc-label">' + c.label + '</div>' +
      '<div class="mc-value">' + c.value + '</div><div class="mc-sub">' + c.sub + '</div></div>';
  }).join("");
}

/* ── details ── */
function pageList(cur, total) {
  var out = [];
  if (total <= 7) {
    for (var i = 1; i <= total; i++) out.push(i);
    return out;
  }
  out.push(1);
  var start = Math.max(2, cur - 1), end = Math.min(total - 1, cur + 1);
  if (start > 2) out.push("…");
  for (var j = start; j <= end; j++) out.push(j);
  if (end < total - 1) out.push("…");
  out.push(total);
  return out;
}

function renderPager(totalPages, shown) {
  var pager = el("pager");
  if (totalPages <= 1 && !shown) { pager.innerHTML = ""; return; }
  var h = '<span class="pg-count">共 ' + shown + ' 条</span>';
  h += '<button class="pg-btn" id="pg-prev">上一页</button>';
  pageList(state.page, totalPages).forEach(function (p) {
    if (p === "…") { h += '<span class="pg-ellipsis">…</span>'; return; }
    h += '<button class="pg-btn' + (p === state.page ? " active" : "") + '" data-page="' + p + '">' + p + "</button>";
  });
  h += '<button class="pg-btn" id="pg-next">下一页</button>';
  h += '<span class="pg-size">每页展示 <select id="pg-size">' +
       [50, 100, 200, 500].map(function (n) {
         return '<option value="' + n + '"' + (n === state.pageSize ? " selected" : "") + ">" + n + "</option>";
       }).join("") + " 条</select></span>";
  pager.innerHTML = h;
  el("pg-prev").disabled = state.page <= 1;
  el("pg-next").disabled = state.page >= totalPages;
  el("pg-prev").addEventListener("click", function () { setPage(state.page - 1); });
  el("pg-next").addEventListener("click", function () { setPage(state.page + 1); });
  pager.querySelectorAll(".pg-btn[data-page]").forEach(function (b) {
    b.addEventListener("click", function () { setPage(Number(b.getAttribute("data-page"))); });
  });
  el("pg-size").addEventListener("change", function () {
    state.pageSize = Number(el("pg-size").value);
    state.page = 1;
    renderAttempts(state.attempts);
  });
}

function setPage(n) {
  var rows = filterAttempts(state.attempts);
  var total = Math.max(1, Math.ceil(rows.length / state.pageSize));
  if (n < 1 || n > total) return;
  state.page = n;
  renderAttempts(state.attempts);
}

function filterAttempts(list) {
  var f = state.filters;
  return list.filter(function (a) {
    if (f.model && a.model !== f.model) return false;
    if (f.stream !== "" && String(a.stream) !== f.stream) return false;
    if (f.status && a.status !== f.status) return false;
    return true;
  });
}

function renderAttempts(list) {
  var rows = filterAttempts(list);
  var totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  var start = (state.page - 1) * state.pageSize;
  var pageRows = rows.slice(start, start + state.pageSize);
  var body = el("attempts-body");
  body.innerHTML = pageRows.map(function (a, i) {
    var p = a.promptTokens, c = a.cachedTokens, o = a.completionTokens;
    var denom = (p || 0) + (c || 0);
    var hit = denom > 0 ? ((c || 0) / denom * 100) : null;
    var hitTxt = (p == null && c == null) ? "未知" : (hit == null ? "无输入" : fmtTokens(denom) + " (" + hit.toFixed(2) + "%)");
    var pTxt = (p == null) ? "?" : fmtNum(p);
    var oTxt = (o == null) ? "?" : fmtNum(o);
    /* the ledger deliberately stores the request id, never the API key */
    var rid = a.reqId || "—";
    var ridShow = rid.length > 16 ? rid.slice(0, 16) + "…" : rid;
    var wire = (a.wire || "?").toUpperCase();
    var streamTxt = a.stream ? "流式" : "非流式";
    var lat = (a.ttfbMs != null ? "首字 " + fmtDur(a.ttfbMs) : "首字 —") + " / " +
              (a.durationMs != null ? "总耗时 " + fmtDur(a.durationMs) : "总耗时 —");
    var retry = (a.attempt || 1) > 1 ? '<span class="muted" title="第 ' + a.attempt + ' 次尝试">x' + a.attempt + '</span>' : "";
    return '<tr>' +
      '<td class="muted">' + (i + 1) + '</td>' +
      '<td title="' + esc(rid) + '">' + esc(ridShow) + '</td>' +
      '<td title="' + esc(a.model) + '">' + esc(a.model) + '</td>' +
      '<td>' + wire + '</td>' +
      '<td>' + streamTxt + '</td>' +
      '<td><span class="badge ' + esc(a.status || "") + '">' + esc(a.status || "?") + '</span></td>' +
      '<td class="tokens-cell"><b class="down">↓' + pTxt + '</b> <b class="up">↑' + oTxt + '</b><small>' + hitTxt + '</small></td>' +
      '<td class="lat-cell">' + lat + '</td>' +
      '<td>' + fmtTime(a.ts) + '</td>' +
      '<td>' + retry + '</td>' +
      '</tr>';
  }).join("");
  el("attempts-empty").style.display = rows.length ? "none" : "block";
  renderPager(totalPages, rows.length);
  var models = {};
  list.forEach(function (a) { models[a.model] = true; });
  var sel = el("f-model");
  var cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>' + Object.keys(models).sort().map(function (m) {
    return '<option value="' + esc(m) + '">' + esc(m) + '</option>';
  }).join("");
  sel.value = cur;
}

/* ── data ── */
function fetchStats() {
  return fetch("/webui/api/stats?days=" + state.days).then(function (r) { return r.json(); })
    .then(renderStats).catch(function () { /* next poll retries */ });
}
function fetchAttempts() {
  return fetch("/webui/api/attempts?limit=200").then(function (r) { return r.json(); })
    .then(function (list) { state.attempts = list; renderAttempts(list); })
    .catch(function () { /* next poll retries */ });
}
function fetchSysinfo() {
  fetch("/webui/api/sysinfo").then(function (r) { return r.json(); }).then(function (s) {
    el("chip-mem").textContent = (s.memMb == null ? "—" : s.memMb.toFixed(1) + " MB");
    el("chip-uptime").textContent = fmtUptime(s.uptimeSecs);
  }).catch(function () { /* transient; next tick retries */ });
}

function connect() {
  var es;
  try { es = new EventSource("/webui/events"); } catch (e) { return; }
  es.onopen = function () { el("chip-live").classList.add("on"); el("chip-live-text").textContent = "实时"; };
  es.onerror = function () {
    el("chip-live").classList.remove("on"); el("chip-live-text").textContent = "重连中";
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000);
  };
  es.onmessage = function (ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.attempts) { state.attempts = msg.attempts; renderAttempts(msg.attempts); }
    if (msg.stats) {
      if (state.days === 14) renderStats(msg.stats);
      else if (Date.now() - state.daysFetchAt > 30000) { state.daysFetchAt = Date.now(); fetchStats(); }
    }
  };
}

/* ── wiring ── */
document.addEventListener("DOMContentLoaded", function () {
  route();
  el("days-7").addEventListener("click", function () { setDays(7); });
  el("days-14").addEventListener("click", function () { setDays(14); });
  el("days-30").addEventListener("click", function () { setDays(30); });
  function setDays(n) {
    state.days = n;
    [7, 14, 30].forEach(function (d) { el("days-" + d).classList.toggle("active", d === n); });
    fetchStats();
  }
  ["f-model", "f-stream", "f-status"].forEach(function (id) {
    el(id).addEventListener("change", function () {
      state.filters[id.replace("f-", "")] = el(id).value;
      state.page = 1;
      renderAttempts(state.attempts);
    });
  });
  el("btn-reset").addEventListener("click", function () {
    state.filters = { model: "", stream: "", status: "" };
    el("f-model").value = ""; el("f-stream").value = ""; el("f-status").value = "";
    state.page = 1;
    renderAttempts(state.attempts);
  });
  el("btn-refresh").addEventListener("click", function () { fetchAttempts(); fetchStats(); });

  /* Astro-style static first: the snapshot shipped inside the HTML wins,
     no network round-trip before first paint; fetch only when absent. */
  var INIT = window.__INIT__;
  if (INIT && INIT.stats) { renderStats(INIT.stats); }
  else { fetchStats(); }
  if (INIT && INIT.attempts) { state.attempts = INIT.attempts; renderAttempts(INIT.attempts); }
  else { fetchAttempts(); }
  fetchSysinfo();
  setInterval(fetchSysinfo, 5000);
  connect();
});
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-proxy WebUI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2312141C'/%3E%3Cpath d='M8 10l8 6-8 6z' fill='%238B7CF6'/%3E%3Cpath d='M17 22h7' stroke='%23EDEFF5' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Stylesheets. Order matters (the cascade depends on it): design tokens
     first, then the shell, then each screen, then the responsive overrides
     last so a media query always wins over the rule it adjusts.
     These are served loose from webui/ (no build-time inlining — see
     webui_site.rs); to add a file, add a line here. -->

<link rel="stylesheet" href="css/tokens.css">
<!-- 主题层：只覆盖颜色令牌，结构令牌与深色共享。必须紧跟 tokens.css，
     否则组件规则里的背景/描边会盖掉主题值。 -->
<link rel="stylesheet" href="css/theme-light.css">
<link rel="stylesheet" href="css/theme-jelly.css">
<link rel="stylesheet" href="css/theme-jelly-dark.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/overview.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/log.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/responsive.css">

<!-- 主题在绘制前定下来，否则浅色用户会先看到一帧深色。
     默认（无 data-theme）是深色；`?theme=` 只给本地对比两套外观用。
     键名与设置页「外观」面板的主题卡一一对应。 -->
<script>
(function () {
  var THEMES = ["light", "jelly"];
  var want = null;
  var q = new URLSearchParams(location.search).get("theme");
  if (q) want = q;
  else { try { want = localStorage.getItem("ccproxy.theme"); } catch (e) {} }
  if (THEMES.indexOf(want) !== -1) document.documentElement.dataset.theme = want;
})();
</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="side-logo">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="lm-bg" width="32" height="32" rx="9"/><path class="lm-play" d="M8 10l8 6-8 6z"/><path class="lm-cursor" d="M17 22h7"/></svg>
    </div>
    <nav class="side-nav">
      <a href="#/stats" class="nav-item active" id="nav-stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        <span>概览</span>
      </a>
      <a href="#/attempts" class="nav-item" id="nav-attempts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>
        <span>明细</span>
      </a>
      <a href="#/logs" class="nav-item" id="nav-logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9L20 9.5v9A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M14 4v5.5h5.5M8 13h8M8 16.5h5"/></svg>
        <span>日志</span>
      </a>
      <a href="#/settings" class="nav-item" id="nav-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.4" stroke-width="1.8"/><circle cx="12" cy="12" r="2.4" stroke-width="1.8"/><path d="M21.4 12h-2.8M2.6 12h2.8M12 2.6v2.8M12 18.6v2.8M18.65 18.65l-1.98-1.98M5.35 5.35l1.98 1.98M18.65 5.35l-1.98 1.98M5.35 18.65l1.98-1.98" stroke-width="2.3"/></svg>
        <span>设置</span>
      </a>
    </nav>
    <div class="side-foot">本机代理服务<br>端口 8787 · 数据本机存储</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="app-name">cc-<em>proxy</em><small id="ver"></small></div>
      <div class="spacer"></div>
      <span class="chip" id="chip-live"><span class="dot"></span><b id="chip-live-text">连接中</b></span>
      <span class="chip">消耗 <b id="chip-cost">—</b></span>
      <span class="chip">内存 <b id="chip-mem">—</b></span>
      <span class="chip">运行 <b id="chip-uptime">—</b></span>
    </header>

    <main class="content">
      <div class="content-inner">
      <!-- ===== 视图：概览 ===== -->
      <section class="view active" id="view-stats">
        <div class="metric-cards" id="metric-cards"></div>

        <div class="ov-grid">
          <div class="panel">
            <h2>
              用量趋势
              <span class="extra window-picker">
                <a data-h="1">近1小时</a>
                <a data-h="24" class="active">24小时</a>
                <a data-h="168">7天</a>
                <a data-h="720">30天</a>
                <input type="datetime-local" id="w-from" title="起始时间">
                <input type="datetime-local" id="w-to" title="结束时间">
                <button id="w-apply" class="btn-mini">应用</button>
                <span class="win-range" id="window-range"></span>
              </span>
            </h2>
            <!-- 绝对量与比率分家：Token 和费用是"量"（柱状图，各自独立量程），
                 命中率是"率"（0–100% 折线）。三张图共用同一套桶几何
                 （padL/padR/viewBox 宽一致），x 轴刻度只画在最底部一张。 -->
            <div class="trend-chart" id="trend-chart">
              <div class="trend-sec">
                <div class="trend-sec-head">
                  <span class="trend-sec-title">Token 用量</span>
                  <span class="trend-sec-note" id="trend-bucket-note"></span>
                  <div class="legend" id="trend-legend"></div>
                </div>
                <svg id="trend-tokens" viewBox="0 0 900 210" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Token 用量分组柱状图"></svg>
              </div>
              <div class="trend-sec">
                <div class="trend-sec-head">
                  <span class="trend-sec-title">费用</span>
                  <span class="trend-sec-note">同 x 轴 · 独立量程（USD）</span>
                </div>
                <svg id="trend-cost" viewBox="0 0 900 64" preserveAspectRatio="xMidYMid meet" role="img" aria-label="费用柱条"></svg>
              </div>
              <div class="trend-sec">
                <div class="trend-sec-head">
                  <span class="trend-sec-title">缓存命中率</span>
                  <span class="trend-sec-note">空桶断线，不插值</span>
                  <div class="legend" id="trend-rate-legend"></div>
                </div>
                <svg id="trend-rate" viewBox="0 0 900 172" preserveAspectRatio="xMidYMid meet" role="img" aria-label="缓存命中率折线与请求数背景柱"></svg>
              </div>
              <div class="trend-foot" id="trend-foot"></div>
            </div>
          </div>

          <div class="panel">
            <h2>
              模型分布
              <span class="extra model-note" id="model-note"></span>
            </h2>
            <div class="model-layout">
              <svg id="model-donut" viewBox="0 0 200 200" role="img" aria-label="模型费用分布"></svg>
              <div class="model-table-card">
                <div class="model-table-wrap">
                  <table class="model-table">
                    <thead>
                      <tr><th>模型</th><th>请求</th><th>Token</th><th>费用</th></tr>
                    </thead>
                    <tbody id="model-body"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== 视图：明细 ===== -->
      <section class="view" id="view-attempts">
        <div class="mini-cards" id="mini-cards"></div>
        <div class="filterbar">
          <div class="f-group">
            <label>时段</label>
            <input type="datetime-local" id="a-from" title="起始时间">
            <input type="datetime-local" id="a-to" title="结束时间">
            <button id="a-apply" class="btn-mini">应用</button>
          </div>
          <div class="f-group">
            <label>模型</label>
            <select id="f-model"><option value="">全部</option></select>
          </div>
          <div class="f-group">
            <label>类型</label>
            <select id="f-stream">
              <option value="">全部</option>
              <option value="1">流式</option>
              <option value="0">非流式</option>
            </select>
          </div>
          <div class="f-group">
            <label>状态</label>
            <select id="f-status">
              <option value="">全部</option>
              <option value="ok">ok</option>
              <option value="error">error</option>
              <option value="aborted">aborted</option>
              <option value="interrupted">interrupted</option>
            </select>
          </div>
          <div class="f-actions">
            <button id="btn-refresh">刷新</button>
            <button id="btn-reset">重置</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <colgroup>
              <!-- 列宽按内容类型分配：序号/端点/类型/状态/时间是固定长度的短文本，
                   给足；模型名是变量长度，允许省略号。# 列从 3% 提到 4%——
                   原宽度扣掉内边距只剩 14px，两位数行号会被截成「1…」。 -->
              <col style="width:4%"><col style="width:11%"><col style="width:13%">
              <col style="width:7.5%"><col style="width:5%"><col style="width:6.5%">
              <col style="width:14%"><col style="width:8%"><col style="width:12%"><col style="width:14%"><col style="width:5%">
            </colgroup>
            <thead>
              <tr>
                <th>#</th><th>请求 ID</th><th>模型</th>
                <th>端点</th><th>类型</th><th>状态</th>
                <th>TOKEN</th><th>费用</th><th>延迟</th><th>时间</th><th>尝试</th>
              </tr>
            </thead>
            <tbody id="attempts-body"></tbody>
          </table>
          <div class="empty" id="attempts-empty" style="display:none">没有符合条件的记录</div>
          <div class="pager" id="pager"></div>
        </div>
        <div class="drawer" id="req-drawer" hidden>
          <div class="drawer-head"><b>请求详情</b><button id="drawer-close" class="btn-mini">×</button></div>
          <div id="drawer-body"></div>
        </div>
      </section>

      <!-- ===== 视图：日志 ===== -->
      <section class="view" id="view-logs">
        <div class="filterbar">
          <div class="f-group">
            <label>日志</label>
            <select id="log-which">
              <option value="proxy">代理日志 proxy.log</option>
              <option value="tray">托盘日志 tray.log</option>
            </select>
            <label class="lvl-filter">
              <input type="checkbox" data-lvl="DEBUG" checked>DEBUG
              <input type="checkbox" data-lvl="INFO" checked>INFO
              <input type="checkbox" data-lvl="WARN" checked>WARN
              <input type="checkbox" data-lvl="ERROR" checked>ERROR
            </label>
            <span class="chip" id="log-follow-chip"><span class="dot"></span><b id="log-follow-text">连接中</b></span>
          </div>
          <div class="f-actions">
            <button id="log-autoscroll" class="active">自动滚动</button>
            <button id="log-refresh">刷新</button>
          </div>
        </div>
        <div class="logbar">
          <span class="logpath" id="log-path" title="">—</span>
          <span class="logmeta" id="log-meta"></span>
        </div>
        <div class="logpane" id="log-pane"></div>
        <div class="empty" id="log-empty" style="display:none">日志不可用</div>
      </section>

      <!-- ===== 视图：设置 ===== -->
      <section class="view" id="view-settings">
        <!-- 更新：检测是静默的（每 6 小时一次，只写状态），安装是一个明确的动作。 -->
        <div class="panel set-panel">
          <h2>更新 <span class="extra" id="upd-tag"></span></h2>
          <div class="upd-row">
            <div class="upd-info">
              <div class="upd-head">
                <span class="upd-version" id="upd-current">—</span>
                <span class="upd-tag">当前运行版本</span>
              </div>
              <div class="upd-note" id="upd-note">正在读取更新状态…</div>
            </div>
            <div class="upd-actions">
              <button class="btn" id="upd-check">检查更新</button>
              <button class="btn primary" id="upd-install" disabled>下载并安装</button>
            </div>
          </div>
          <div class="upd-progress" id="upd-progress" hidden>
            <div class="upd-bar"><i></i></div>
            <span class="upd-msg" id="upd-msg"></span>
          </div>
        </div>

        <!-- 设置：文档与托盘读写同一个文件，应用后由托盘重启代理生效。 -->
        <div class="panel set-panel">
          <h2>设置 <span class="extra" id="set-rev"></span></h2>
          <div id="set-fields"><div class="empty">正在读取配置…</div></div>
          <div class="set-foot">
            <span class="set-status" id="set-status"></span>
            <span class="fgrow"></span>
            <button class="btn" id="set-revert" disabled>还原改动</button>
            <button class="btn" id="set-restart">重启代理</button>
            <button class="btn primary" id="set-apply" disabled>应用</button>
          </div>
        </div>

        <!-- 外观：主题存在浏览器本地（localStorage），不写 ccproxy.json。
             放在设置页而不是侧栏：换主题是低频动作，不该占侧栏的常驻位置。 -->
        <div class="panel set-panel">
          <h2>外观</h2>
          <div class="theme-grid" id="theme-grid">
            <button class="theme-card" type="button" data-theme-key="dark" aria-pressed="false">
              <span class="theme-swatch sw-dark" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="theme-name">深色</span>
              <span class="theme-note">扁平 · 默认</span>
            </button>
            <button class="theme-card" type="button" data-theme-key="light" aria-pressed="false">
              <span class="theme-swatch sw-light" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="theme-name">浅瓷</span>
              <span class="theme-note">一比一浅色</span>
            </button>
            <button class="theme-card" type="button" data-theme-key="jelly" aria-pressed="false">
              <span class="theme-swatch sw-jelly" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="theme-name">冰态果冻</span>
              <span class="theme-note">粉紫玻璃</span>
            </button>
            <button class="theme-card" type="button" data-theme-key="jelly-dark" aria-pressed="false">
              <span class="theme-swatch sw-jelly-dark" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="theme-name">冰态果冻·暗</span>
              <span class="theme-note">粉紫玻璃 · 深色</span>
            </button>
          </div>
          <p class="theme-hint">主题只保存在本机浏览器，不写入 ccproxy.json；换浏览器或清缓存会回到默认深色。</p>
        </div>
      </section>
      </div>
    </main>
  </div>
</div>
<!-- 趋势悬停浮层必须挂在 .shell 之外。
     果冻主题的 .panel 带 backdrop-filter，而 backdrop-filter 会为
     position:fixed 的后代创建包含块 —— 浮层的 left/top 被当成「面板内
     坐标」解释，实际渲染会跑到鼠标右下角、偏出一个面板原点的距离。
     放在 body 直属层没有这个包含块，clientX/clientY 与视口一致。 -->
<div class="trend-tip" id="trend-tip" hidden></div>
<!-- Scripts, in load order. These are classic scripts (no modules): they share
     one global scope, and app.js wires everything up on DOMContentLoaded, so
     order is what makes the earlier files' functions visible to the later
     ones. The page itself is static (no inline snapshot): its body is
     cache-stable, so a reload is a 304, and the first paint hydrates from
     the JSON APIs in parallel. -->
<script src="js/core.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/router.js"></script>
<script src="js/stats.js"></script>
<script src="js/attempts.js"></script>
<script src="js/api.js"></script>
<script src="js/logs.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>

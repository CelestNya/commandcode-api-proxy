<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-proxy WebUI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2312161D'/%3E%3Cpath d='M8 10l8 6-8 6z' fill='%238AB4F8'/%3E%3Cpath d='M17 22h7' stroke='%23D3E3FD' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Stylesheets. Order matters (the cascade depends on it): design tokens
     first, then the shell, then each screen, then the responsive overrides
     last so a media query always wins over the rule it adjusts.
     build.rs inlines these in exactly this order, so this list is the whole
     composition — to add a file, add a line here. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/overview.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/log.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="side-logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1E3A5F"/><path d="M8 10l8 6-8 6z" fill="#8AB4F8"/><path d="M17 22h7" stroke="#D3E3FD" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <nav class="side-nav">
      <a href="#/stats" class="nav-item active" id="nav-stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        <span>概览</span>
      </a>
      <a href="#/attempts" class="nav-item" id="nav-attempts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>
        <span>明细</span>
      </a>
      <a href="#/logs" class="nav-item" id="nav-logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9L20 9.5v9A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M14 4v5.5h5.5M8 13h8M8 16.5h5"/></svg>
        <span>日志</span>
      </a>
    </nav>
    <div class="side-foot">本机代理服务<br>端口 8787 · 数据本机存储</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="app-name">cc-proxy<small id="ver"></small></div>
      <div class="spacer"></div>
      <span class="chip" id="chip-live"><span class="dot"></span><b id="chip-live-text">连接中</b></span>
      <span class="chip">消耗 <b id="chip-cost">—</b></span>
      <span class="chip">内存 <b id="chip-mem">—</b></span>
      <span class="chip">运行 <b id="chip-uptime">—</b></span>
    </header>

    <main class="content">
      <div class="content-inner">
      <!-- ===== 视图：概览 ===== -->
      <section class="view active" id="view-stats">
        <div class="metric-cards" id="metric-cards"></div>


        <div class="panel" style="margin-top:12px">
          <h2>
            Token 使用趋势
            <span class="extra">
              <span style="color:var(--muted)">时间范围</span>
              <a id="days-7" data-days="7">近7天</a>
              <a id="days-14" class="active" data-days="14">近14天</a>
              <a id="days-30" data-days="30">近30天</a>
            </span>
          </h2>
          <div class="trend-chart">
            <div class="legend" id="trend-legend"></div>
            <svg id="trend-chart" viewBox="0 0 900 300" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
        </div>

        <div class="ov-row">
          <div class="panel">
            <h2>模型分布 <span class="extra" id="model-count"></span></h2>
            <div class="model-layout">
              <svg id="model-donut" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"></svg>
              <div>
                <table class="model-table">
                  <thead><tr><th>模型</th><th>请求</th><th>Token</th><th>费用</th></tr></thead>
                  <tbody id="model-table"></tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="panel">
            <h2>状态分布 <span class="extra" id="status-summary"></span></h2>
            <div id="status-bars"></div>
          </div>
        </div>
      </section>

      <!-- ===== 视图：明细 ===== -->
      <section class="view" id="view-attempts">
        <div class="mini-cards" id="mini-cards"></div>
        <div class="filterbar">
          <label>模型</label>
          <select id="f-model"><option value="">全部</option></select>
          <label>类型</label>
          <select id="f-stream">
            <option value="">全部</option>
            <option value="1">流式</option>
            <option value="0">非流式</option>
          </select>
          <label>状态</label>
          <select id="f-status">
            <option value="">全部</option>
            <option value="ok">ok</option>
            <option value="error">error</option>
            <option value="aborted">aborted</option>
            <option value="interrupted">interrupted</option>
          </select>
          <span class="fgrow"></span>
          <button id="btn-refresh">刷新</button>
          <button id="btn-reset">重置</button>
        </div>
        <div class="table-wrap">
          <table>
            <colgroup>
              <col style="width:4%"><col style="width:14%"><col style="width:15%">
              <col style="width:7%"><col style="width:6%"><col style="width:8%">
              <col style="width:15%"><col style="width:13%"><col style="width:14%"><col style="width:4%">
            </colgroup>
            <thead>
              <tr>
                <th>#</th><th>请求 ID</th><th>模型</th>
                <th>端点</th><th>类型</th><th>状态</th>
                <th>TOKEN</th><th>延迟</th><th>时间</th><th>尝试</th>
              </tr>
            </thead>
            <tbody id="attempts-body"></tbody>
          </table>
          <div class="empty" id="attempts-empty" style="display:none">没有符合条件的记录</div>
          <div class="pager" id="pager"></div>
        </div>
      </section>

      <!-- ===== 视图：日志 ===== -->
      <section class="view" id="view-logs">
        <div class="filterbar">
          <label>日志</label>
          <select id="log-which">
            <option value="proxy">代理日志 proxy.log</option>
            <option value="tray">托盘日志 tray.log</option>
          </select>
          <span class="chip" id="log-follow-chip"><span class="dot"></span><b id="log-follow-text">连接中</b></span>
          <span class="fgrow"></span>
          <button id="log-autoscroll" class="active">自动滚动</button>
          <button id="log-refresh">刷新</button>
        </div>
        <div class="logbar">
          <span class="logpath" id="log-path" title="">—</span>
          <span class="logmeta" id="log-meta"></span>
        </div>
        <div class="logpane" id="log-pane"></div>
        <div class="empty" id="log-empty" style="display:none">日志不可用</div>
      </section>
      </div>
    </main>
  </div>
</div>
<!-- Scripts, in load order. These are classic scripts (no modules): they share
     one global scope, and app.js wires everything up on DOMContentLoaded, so
     order is what makes the earlier files' functions visible to the later
     ones. build.rs concatenates them in exactly this order. The page itself is
     static (no inline snapshot): its body is cache-stable, so a reload is a
     304, and the first paint hydrates from the JSON APIs in parallel. -->
<script src="js/core.js"></script>
<script src="js/router.js"></script>
<script src="js/stats.js"></script>
<script src="js/attempts.js"></script>
<script src="js/api.js"></script>
<script src="js/logs.js"></script>
<script src="js/app.js"></script>
</body>
</html>

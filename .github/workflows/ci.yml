name: CI

on:
  push:
    branches: [rust-rewrite, main]
  pull_request:
    branches: [rust-rewrite, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo build --release --locked -p ccproxy
      - run: cargo test --locked -p ccproxy
      - run: cargo clippy --all-targets --all-features --locked -p ccproxy -- -D warnings
      - run: cargo fmt --check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build both binaries
        run: cargo build --release --locked
      - name: Run the full suite (proxy + tray)
        run: cargo test --locked

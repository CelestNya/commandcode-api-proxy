name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p ccproxy
      - run: cargo test --locked -p ccproxy
      - run: cargo clippy --all-targets --all-features --locked -p ccproxy -- -D warnings
      # Linux 编译实证：tray 的 zbus/ksni 后端只能在 ubuntu runner 验证
      #（本机 Windows 无 Linux 交叉编译链）。
      - name: Tray build (Linux compile proof)
        run: cargo build --release --locked -p ccproxy-tray
      - name: Tray tests (contract suite + linux units)
        run: cargo test --locked -p ccproxy-tray
      - name: Tray clippy
        run: cargo clippy --all-targets --all-features --locked -p ccproxy-tray -- -D warnings
      - run: cargo fmt --check
      - name: Doc build (rustdoc, warnings as errors)
        run: cargo doc --no-deps --locked -p ccproxy
        env:
          RUSTDOCFLAGS: "-D warnings"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build both binaries
        run: cargo build --release --locked
      - name: Run the full suite (proxy + tray)
        run: cargo test --locked

  linux-sni-smoke:
    # SNI 运行时冒烟：起私有 session bus，运行托盘，并在 DBus 上验证桌面
    # 外壳（KDE 面板）接入托盘的完整契约——注册、属性、菜单布局、以及
    # 通过 DBusMenu 点击「启动代理」真正拉起代理。比"编译实证"多验证
    # 一整层；面板渲染本身仍需真机 KDE 目视确认。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure DBus tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dbus libglib2.0-bin
      - name: Build tray + proxy
        run: cargo build --locked -p ccproxy-tray -p ccproxy
      - name: SNI smoke test
        run: bash scripts/sni-smoke.sh target/debug

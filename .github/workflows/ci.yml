name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p ccproxy
      - run: cargo test --locked -p ccproxy
      - run: cargo clippy --all-targets --all-features --locked -p ccproxy -- -D warnings
      # Linux 编译实证：tray 的 zbus/ksni 后端只能在 ubuntu runner 验证
      #（本机 Windows 无 Linux 交叉编译链）。
      - name: Tray build (Linux compile proof)
        run: cargo build --release --locked -p ccproxy-tray
      - name: Tray tests (contract suite + linux units)
        run: cargo test --locked -p ccproxy-tray
      - name: Tray clippy
        run: cargo clippy --all-targets --all-features --locked -p ccproxy-tray -- -D warnings
      - run: cargo fmt --check
      - name: Doc build (rustdoc, warnings as errors)
        run: cargo doc --no-deps --locked -p ccproxy
        env:
          RUSTDOCFLAGS: "-D warnings"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build both binaries
        run: cargo build --release --locked
      - name: Run the full suite (proxy + tray)
        run: cargo test --locked

  linux-sni-smoke:
    # SNI 运行时契约：起私有 session bus + 伪造 StatusNotifierWatcher
    # （扮演 Plasma 面板侧），运行真实 LinuxTray，在 DBus 上验证面板接入
    # 托盘的完整契约——注册、属性、菜单布局、以及通过 DBusMenu 点击
    # 「启动代理」「退出」驱动事件回调。裸 runner 上该测试自动跳过；
    # 面板渲染本身仍需真机 KDE 目视确认。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure dbus-run-session
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dbus
      - name: Build tray
        run: cargo build --locked -p ccproxy-tray
      - name: SNI contract test (private session bus)
        run: dbus-run-session -- cargo test --locked -p ccproxy-tray sni_contract -- --nocapture

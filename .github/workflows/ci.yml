name: CI

# Runs on push/PR to main/dev and can be triggered manually from the Actions
# tab (workflow_dispatch) so feature branches can be gated without opening a
# PR. Release packaging lives in release.yml; this file only proves the tree
# builds, tests and lints on every supported OS.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  quality:
    # Ubuntu 22.04 pinned: matches the release glibc baseline (2.35) so a
    # warning that only shows up on newer toolchains doesn't slip through.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy (workspace, all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace --locked
      - name: cargo doc (warnings as errors)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: packaging/layout.toml --check
        # The declarative layout is the contract for every product; validate
        # it on every push so a malformed entry fails here, not in release.
        run: cargo xtask layout --check

  native-test:
    # Matrix: one job per OS. Builds and tests the whole workspace natively on
    # each platform. This is where Linux-only code paths (zbus/ksni tray,
    # unix process primitives) and Windows-only paths (Win32 tray, named mutex)
    # actually get exercised.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # Cache is keyed by runner OS automatically; Windows and Linux targets
        # never share a CARGO_TARGET_DIR.
      - name: cargo build --release (workspace)
        run: cargo build --release --locked --workspace
      - name: cargo test (workspace)
        run: cargo test --locked --workspace

  linux-sni-smoke:
    # SNI runtime contract: spin up a private session bus with a fake
    # StatusNotifierWatcher (standing in for the Plasma/GNOME panel) and run
    # the real LinuxTray against DBus. Verifies registration, properties, menu
    # layout and DBusMenu-driven "start proxy"/"quit" callbacks. The bare
    # runner skips gracefully if no session bus is available; visual panel
    # rendering still needs a real KDE session.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure dbus-run-session
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dbus
      - name: Build tray
        run: cargo build --locked -p ccproxy-tray
      - name: SNI contract test (private session bus)
        run: dbus-run-session -- cargo test --locked -p ccproxy-tray sni_contract -- --nocapture

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p ccproxy
      - run: cargo test --locked -p ccproxy
      - run: cargo clippy --all-targets --all-features --locked -p ccproxy -- -D warnings
      # Linux 编译实证：tray 的 zbus/ksni 后端只能在 ubuntu runner 验证
      #（本机 Windows 无 Linux 交叉编译链）。
      - name: Tray build (Linux compile proof)
        run: cargo build --release --locked -p ccproxy-tray
      - name: Tray tests (contract suite + linux units)
        run: cargo test --locked -p ccproxy-tray
      - name: Tray clippy
        run: cargo clippy --all-targets --all-features --locked -p ccproxy-tray -- -D warnings
      - run: cargo fmt --check
      - name: Doc build (rustdoc, warnings as errors)
        run: cargo doc --no-deps --locked -p ccproxy
        env:
          RUSTDOCFLAGS: "-D warnings"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build both binaries
        run: cargo build --release --locked
      - name: Run the full suite (proxy + tray)
        run: cargo test --locked

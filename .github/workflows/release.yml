name: Release

# Build, test and publish a release. Triggered when a `v*` tag is pushed (the
# standard release flow) or manually from the Actions tab (workflow_dispatch)
# to exercise the pipeline without publishing — `publish` is tag-only.
#
# Release name is `commandcode-proxy` (the crate stays `ccproxy`; "ccproxy" is
# ambiguous and banned as a published name). Layout inside the Windows zip
# (same as build-rust.cmd's package): tray at the root, proxy in service/,
# package.json carries the version — extract anywhere and double-click
# CCProxyTray.exe. The webui/ folder on disk is the single source of truth
# for the panel (nothing is compiled into the binary since the front-end
# split), so a style/script edit is picked up by a reload without a rebuild.
#
# Linux artifacts (see docs/LINUX-PORT-PLAN.md §5 T3.x):
#   - .deb x2: commandcode-proxy_<ver>-1_amd64.deb (+ systemd unit, webui, env)
#     and commandcode-proxy-tray_<ver>-1_amd64.deb (depends on the proxy)
#   - Linux tarball: commandcode-proxy-<ver>-linux-x86_64.tar.gz (no `v` in the
#     asset name, matching what existing Releases publish and AUR fetches)
#   - AppImage: commandcode-proxy-<ver>-x86_64.AppImage
#   - AUR source tarball + rendered PKGBUILD + .SRCINFO for
#     commandcode-proxy-bin (precompiled)
#
# GitHub decides "latest" by publish time, NOT by version ordering — v0.5.0
# once won latest merely by being published a second later than v0.5.2.
# make_latest: true pins every release produced here as latest, so the
# download button always points at the newest publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build both binaries
        run: cargo build --release --locked
      - name: Stage and zip the runnable package
        # `cargo xtask dist` is the single Windows packaging entry point: it
        # reads packaging/layout.toml, stages windows-portable (tray at root,
        # proxy in service/, WebUI tree, generated package.json and default
        # config), writes a deterministic ZIP, SHA256SUMS and a JSON manifest,
        # and re-reads the ZIP with ccproxy::archive::read to prove the updater
        # can open it. --skip-build because the binaries were just built above.
        run: cargo xtask dist --platform windows --skip-build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          # Final ZIP plus its per-artifact manifest and SHA256SUMS. dist/stage/
          # is an intermediate tree and must never be uploaded.
          path: |
            dist/commandcode-proxy-v*-windows-x86_64.zip
            dist/commandcode-proxy-v*-windows-x86_64.zip.manifest.json
            dist/commandcode-proxy-v*-windows-x86_64.zip.SHA256SUMS
          if-no-files-found: error

  linux:
    # 22.04 pinned: the release binaries' glibc baseline is the builder's
    # (2.35 here). ubuntu-latest (24.04, glibc 2.39) produced binaries that
    # refuse to start on Debian 12 / Ubuntu 22.04 — the very distros the
    # .deb targets.
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Stage tarball, deb roots and AppDir via xtask
        # `cargo xtask dist --platform linux` reads packaging/layout.toml and
        # produces: linux-portable tar.gz + manifest + SHA256SUMS, deb-proxy
        # and deb-tray roots under dist/deb/<pkg>/ (with DEBIAN/control and
        # maintainer scripts), and an AppDir under dist/appimage/AppDir/.
        run: cargo xtask dist --platform linux --skip-build
      - name: Compute proxy Depends via dpkg-shlibdeps
        # cargo-deb is gone; dpkg-shlibdeps walks the proxy binary's NEEDED
        # entries and emits the runtime library deps. It requires a debian/control
        # in cwd, so we build a minimal one in a temp dir, cd there, and run it
        # with stderr visible (the previous `2>/dev/null` hid real failures).
        # The result is spliced into the staged DEBIAN/control (tray already
        # declares the same-version proxy dependency statically).
        #
        # Version comes from the workspace Cargo.toml (the single source), not
        # from github.ref_name — a dry-run on a feature branch would otherwise
        # produce `commandcode-proxy_feat/multidist-1_amd64.deb`.
        run: |
          set -euo pipefail
          VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "workspace version: $VER"
          # Semver shape: MAJOR.MINOR.PATCH, optional -rcN / -betaN pre-release.
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
            || { echo "error: workspace version '$VER' is not semver" >&2; exit 1; }
          DEB=dist/deb/commandcode-proxy
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/debian"
          cat > "$TMP/debian/control" <<EOF
          Source: commandcode-proxy
          Package: commandcode-proxy
          Architecture: amd64
          Description: dpkg-shlibdeps probe
          EOF
          # Note: dpkg-shlibdeps prints "binaries to analyze should already be
          # installed in their package's directory" as an informational warning
          # when invoked against an unpacked tree; it does not affect the
          # shlibs:Depends line we splice in.
          DEPS_RAW="$(cd "$TMP" && dpkg-shlibdeps -O -e "$GITHUB_WORKSPACE/$DEB/usr/bin/commandcode-proxy")"
          # The shlibs output must be exactly one "shlibs:Depends=..." line.
          DEP_LINES="$(printf '%s\n' "$DEPS_RAW" | grep -c '^shlibs:Depends=' || true)"
          test "$DEP_LINES" = "1" || { echo "expected 1 shlibs:Depends line, got $DEP_LINES" >&2; printf '%s\n' "$DEPS_RAW" >&2; exit 1; }
          DEPS="$(printf '%s\n' "$DEPS_RAW" | sed -n 's/^shlibs:Depends=//p')"
          test -n "$DEPS"
          awk -v d="Depends: $DEPS" '/^Description:/ && !done { print d; done=1 } { print }' \
            "$DEB/DEBIAN/control" > "$DEB/DEBIAN/control.new"
          mv "$DEB/DEBIAN/control.new" "$DEB/DEBIAN/control"
          cat "$DEB/DEBIAN/control"
          rm -rf "$TMP"
      - name: Build .deb packages
        # Filenames are canonicalized by `cargo xtask dist --platform linux` and
        # written to dist/deb-names.txt (one per line). We consume that file
        # rather than re-deriving the names here; the assertion below guarantees
        # the workflow's expected shape matches what xtask emitted.
        run: |
          set -euo pipefail
          VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
            || { echo "error: workspace version '$VER' is not semver" >&2; exit 1; }
          test -f dist/deb-names.txt || { echo "dist/deb-names.txt missing — run xtask dist first" >&2; exit 1; }
          # Expected filenames derived from the workspace version.
          EXPECT_PROXY="commandcode-proxy_${VER}-1_amd64.deb"
          EXPECT_TRAY="commandcode-proxy-tray_${VER}-1_amd64.deb"
          GOT_PROXY="$(sed -n '1p' dist/deb-names.txt)"
          GOT_TRAY="$(sed -n '2p' dist/deb-names.txt)"
          test "$GOT_PROXY" = "$EXPECT_PROXY" || { echo "expected $EXPECT_PROXY, xtask reported $GOT_PROXY" >&2; exit 1; }
          test "$GOT_TRAY" = "$EXPECT_TRAY" || { echo "expected $EXPECT_TRAY, xtask reported $GOT_TRAY" >&2; exit 1; }
          for pair in "commandcode-proxy:$GOT_PROXY" "commandcode-proxy-tray:$GOT_TRAY"; do
            pkg="${pair%%:*}"
            out="dist/${pair#*:}"
            dpkg-deb --build "dist/deb/$pkg" "$out"

            # Field assertions: use `dpkg-deb --field` to read the value directly
            # (no regex, no pipe). `--info` emits indented lines that a "^Package:"
            # grep would miss, and `grep -q` on a pipe under pipefail turns
            # SIGPIPE (141) into a non-zero exit.
            expect_field() {
              got="$(dpkg-deb --field "$out" "$1")"
              want="$2"
              if [ "$got" != "$want" ]; then
                echo "error: $out field $1: got='$got' expected='$want'" >&2
                exit 1
              fi
            }
            expect_field Package "$pkg"
            expect_field Version "${VER}-1"
            expect_field Architecture "amd64"
            if [ "$pkg" = "commandcode-proxy-tray" ]; then
              expect_field Depends "commandcode-proxy (= ${VER}-1)"
            fi

            # File-list assertions: dump --contents to a temp file first so grep
            # reads the whole file (no SIGPIPE under pipefail). Then grep -c
            # against the anchor paths.
            contents="$(mktemp)"
            dpkg-deb --contents "$out" > "$contents"
            expect_file_in_contents() {
              needle="$1"
              count="$(grep -c -F "$needle" "$contents" || true)"
              if [ "$count" != "1" ]; then
                echo "error: $out expected exactly 1 match for '$needle', got $count" >&2
                echo "--- contents ---" >&2
                cat "$contents" >&2
                exit 1
              fi
            }
            case "$pkg" in
              commandcode-proxy)
                expect_file_in_contents "./usr/bin/commandcode-proxy"
                expect_file_in_contents "./lib/systemd/system/commandcode-proxy.service"
                expect_file_in_contents "./etc/commandcode-proxy/env.example"
                ;;
              commandcode-proxy-tray)
                expect_file_in_contents "./usr/bin/commandcode-proxy-tray"
                expect_file_in_contents "./usr/share/applications/commandcode-proxy-tray.desktop"
                ;;
            esac
            rm -f "$contents"
            echo "built $out"
          done
      - name: Syntax-check maintainer scripts and systemd unit
        run: |
          set -euo pipefail
          for s in preinst postinst prerm postrm; do
            bash -n "dist/deb/commandcode-proxy/DEBIAN/$s"
          done
          if command -v systemd-analyze >/dev/null 2>&1; then
            # Path matches layout.toml's dest: lib/systemd/system/... (not usr/lib).
            systemd-analyze verify dist/deb/commandcode-proxy/lib/systemd/system/commandcode-proxy.service
          else
            echo "systemd-analyze unavailable; skipping (container has no systemd)"
          fi
      - name: Build AppImage
        # AppDir was staged by xtask; this script only adds appimagetool and
        # packages it. No per-file binary/webui copies happen here.
        run: bash packaging/appimage/build-appimage.sh "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" "$GITHUB_WORKSPACE"
      - name: Render PKGBUILD and verify AUR
        run: |
          VER=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          bash packaging/aur/build-tarball.sh "$VER" "$GITHUB_WORKSPACE"
          bash packaging/aur/verify-aur.sh "$VER" "$GITHUB_WORKSPACE"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          # Only final deliverables: tar.gz, two .deb, AppImage, PKGBUILD,
          # .SRCINFO. Never dist/deb roots, AppDir, stage/ or pkg/ intermediates.
          # Linux tarball has no `v` in the asset filename (matches published
          # Releases); debs follow <pkg>_<ver>-1_amd64.deb.
          path: |
            dist/commandcode-proxy-*-linux-x86_64.tar.gz
            dist/commandcode-proxy-*-linux-x86_64.tar.gz.manifest.json
            dist/commandcode-proxy-*-linux-x86_64.tar.gz.SHA256SUMS
            dist/commandcode-proxy_*_amd64.deb
            packaging-out/commandcode-proxy-*.AppImage
            packaging-out/PKGBUILD
            packaging-out/.SRCINFO
          if-no-files-found: error

  publish:
    # Tag-only: workflow_dispatch runs build the pipeline but must not create
    # or mutate a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [windows, linux]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            dist/windows/commandcode-proxy-v*.zip
            dist/windows/commandcode-proxy-v*.zip.manifest.json
            dist/windows/commandcode-proxy-v*.zip.SHA256SUMS
            dist/linux/dist/commandcode-proxy-*-linux-x86_64.tar.gz
            dist/linux/dist/commandcode-proxy-*-linux-x86_64.tar.gz.manifest.json
            dist/linux/dist/commandcode-proxy-*-linux-x86_64.tar.gz.SHA256SUMS
            dist/linux/dist/commandcode-proxy_*_amd64.deb
            dist/linux/packaging-out/commandcode-proxy-*.AppImage
            dist/linux/packaging-out/PKGBUILD
            dist/linux/packaging-out/.SRCINFO

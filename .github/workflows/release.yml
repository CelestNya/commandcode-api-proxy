name: Release

# Build, test and publish a release. Triggered when a `v*` tag is pushed
# (the normal release flow) or manually from the Actions tab
# (workflow_dispatch) when a release is needed without a new tag.
#
# GitHub decides "latest" by publish time, NOT by version ordering — v0.5.0
# once won latest merely by being published a second later than v0.5.2.
# make_latest: true pins every release produced here as latest, so the
# newest publish is always what the download button points at.
#
# The hot-swap package layout is produced locally by build-rust.cmd; this
# workflow exists so a tagged build always has reproducible binaries
# attached and marked latest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build both binaries
        run: cargo build --release --locked
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            target/release/ccproxy.exe
            target/release/CCProxyTray.exe

name: Release

# Build, test and publish a release. Triggered when a `v*` tag is pushed (the
# standard release flow) or manually from the Actions tab (workflow_dispatch)
# to exercise the pipeline without publishing — `publish` is tag-only.
#
# Release name is `commandcode-proxy` (the crate stays `ccproxy`; "ccproxy" is
# ambiguous and banned as a published name). Layout inside the Windows zip
# (same as build-rust.cmd's package): tray at the root, proxy in service/,
# package.json carries the version — extract anywhere and double-click
# CCProxyTray.exe. The webui/ folder on disk is the single source of truth
# for the panel (nothing is compiled into the binary since the front-end
# split), so a style/script edit is picked up by a reload without a rebuild.
#
# Linux artifacts (see docs/LINUX-PORT-PLAN.md §5 T3.x):
#   - .deb x2: commandcode-proxy (+ systemd unit, webui, env) and
#     commandcode-proxy-tray (depends on the proxy)
#   - AppImage: commandcode-proxy-<ver>-x86_64.AppImage
#   - AUR source tarball + rendered PKGBUILD + .SRCINFO for
#     commandcode-proxy-bin (precompiled)
#
# GitHub decides "latest" by publish time, NOT by version ordering — v0.5.0
# once won latest merely by being published a second later than v0.5.2.
# make_latest: true pins every release produced here as latest, so the
# download button always points at the newest publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build both binaries
        run: cargo build --release --locked
      - name: Stage and zip the runnable package
        # `cargo xtask dist` is the single Windows packaging entry point: it
        # reads packaging/layout.toml, stages windows-portable (tray at root,
        # proxy in service/, WebUI tree, generated package.json and default
        # config), writes a deterministic ZIP, SHA256SUMS and a JSON manifest,
        # and re-reads the ZIP with ccproxy::archive::read to prove the updater
        # can open it. --skip-build because the binaries were just built above.
        run: cargo xtask dist --platform windows --skip-build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          # Only the final ZIP; dist/stage/ is an intermediate tree, never a release.
          path: dist/commandcode-proxy-v*-windows-x86_64.zip
          if-no-files-found: error

  linux:
    # 22.04 pinned: the release binaries' glibc baseline is the builder's
    # (2.35 here). ubuntu-latest (24.04, glibc 2.39) produced binaries that
    # refuse to start on Debian 12 / Ubuntu 22.04 — the very distros the
    # .deb targets.
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Stage tarball, deb roots and AppDir via xtask
        # `cargo xtask dist --platform linux` reads packaging/layout.toml and
        # produces: linux-portable tar.gz + manifest + SHA256SUMS, deb-proxy
        # and deb-tray roots under dist/deb/<pkg>/ (with DEBIAN/control and
        # maintainer scripts), and an AppDir under dist/appimage/AppDir/.
        run: cargo xtask dist --platform linux --skip-build
      - name: Compute proxy Depends via dpkg-shlibdeps
        # cargo-deb is gone; dpkg-shlibdeps walks the proxy binary's NEEDED
        # entries and emits the runtime library deps. We splice the result into
        # the staged DEBIAN/control (tray already declares the same-version
        # proxy dependency statically).
        run: |
          set -euo pipefail
          DEB=dist/deb/commandcode-proxy
          # Need a minimal debian/control for dpkg-shlibdeps -e to parse.
          DEPS=$(dpkg-shlibdeps -O -e "$DEB/usr/bin/commandcode-proxy" 2>/dev/null \
            | sed -n 's/^shlibs:Depends=//p')
          # dpkg-shlibdeps emits "Depends:" line; insert before Description.
          awk -v d="Depends: $DEPS" '/^Description:/ && !done { print d; done=1 } { print }' \
            "$DEB/DEBIAN/control" > "$DEB/DEBIAN/control.new"
          mv "$DEB/DEBIAN/control.new" "$DEB/DEBIAN/control"
          cat "$DEB/DEBIAN/control"
      - name: Build .deb packages
        run: |
          set -euo pipefail
          for pkg in commandcode-proxy commandcode-proxy-tray; do
            dpkg-deb --build "dist/deb/$pkg" "dist/$pkg.deb"
            dpkg-deb --info "dist/$pkg.deb" | head -20
            dpkg-deb --contents "dist/$pkg.deb" | head -30
          done
      - name: Syntax-check maintainer scripts and systemd unit
        run: |
          set -euo pipefail
          for s in preinst postinst prerm postrm; do
            bash -n "dist/deb/commandcode-proxy/DEBIAN/$s"
          done
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify dist/deb/commandcode-proxy/usr/lib/systemd/system/commandcode-proxy.service
          else
            echo "systemd-analyze unavailable; skipping (container has no systemd)"
          fi
      - name: Build AppImage
        # AppDir was staged by xtask; this script only adds appimagetool and
        # packages it. No per-file binary/webui copies happen here.
        run: bash packaging/appimage/build-appimage.sh "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" "$GITHUB_WORKSPACE"
      - name: Render PKGBUILD and verify AUR
        run: |
          VER=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          bash packaging/aur/build-tarball.sh "$VER" "$GITHUB_WORKSPACE"
          bash packaging/aur/verify-aur.sh "$VER" "$GITHUB_WORKSPACE"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          # Only final deliverables: tar.gz, two .deb, AppImage, PKGBUILD,
          # .SRCINFO. Never dist/deb roots, AppDir, stage/ or pkg/ intermediates.
          path: |
            dist/commandcode-proxy-v*-linux-x86_64.tar.gz
            dist/commandcode-proxy-v*-linux-x86_64.tar.gz.manifest.json
            dist/commandcode-proxy-v*-linux-x86_64.tar.gz.SHA256SUMS
            dist/commandcode-proxy.deb
            dist/commandcode-proxy-tray.deb
            packaging-out/commandcode-proxy-*.AppImage
            packaging-out/PKGBUILD
            packaging-out/.SRCINFO
          if-no-files-found: error

  publish:
    # Tag-only: workflow_dispatch runs build the pipeline but must not create
    # or mutate a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [windows, linux]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            dist/windows/commandcode-proxy-v*.zip
            dist/linux/dist/commandcode-proxy-v*-linux-x86_64.tar.gz
            dist/linux/dist/commandcode-proxy-v*-linux-x86_64.tar.gz.manifest.json
            dist/linux/dist/commandcode-proxy-v*-linux-x86_64.tar.gz.SHA256SUMS
            dist/linux/dist/commandcode-proxy.deb
            dist/linux/dist/commandcode-proxy-tray.deb
            dist/linux/packaging-out/commandcode-proxy-*.AppImage
            dist/linux/packaging-out/PKGBUILD
            dist/linux/packaging-out/.SRCINFO

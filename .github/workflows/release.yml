name: Release

# Personal fork: this never publishes to npm. The package name is shared with
# the upstream project, so an accidental `pnpm publish` would be an outward
# facing mistake. Releases here are GitHub-only.
#
# The Windows tray zip is built locally (tray\build.cmd needs a Windows host and
# the C# compiler) and attached to the release by hand.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Personal build. Source-only release — the Windows tray package
            (`CCProxy-<version>-win-x64.zip`) is built locally with
            `pnpm release:tray` and attached manually.

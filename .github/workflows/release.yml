name: Release

# Personal fork: this never publishes to npm. Releases here are GitHub-only —
# the artifacts are the two Rust binaries built on a Windows runner (the tray
# is Windows-only) and attached to the tag.
#
# The hot-swap package (release\CCProxyRust layout with the version-stamped
# package.json) is produced locally by build-rust.cmd; the CI release exists
# so a tagged build always has reproducible binaries attached.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build both binaries
        run: cargo build --release --locked
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/ccproxy.exe
            target/release/CCProxyTray.exe

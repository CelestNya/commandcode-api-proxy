[workspace]
resolver = "2"
members = ["crates/ccproxy", "crates/ccproxy-tray"]

[workspace.package]
edition = "2021"
version = "0.6.7"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["gzip", "brotli"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
